<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GamerHub - Oyuncu Portalı</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0f172a',
                        cardBg: '#1e293b',
                        accent: '#6366f1'
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-darkBg text-slate-100 min-h-screen flex flex-col font-sans selection:bg-indigo-500 selection:text-white">

    <header class="bg-cardBg/80 backdrop-blur-md border-b border-slate-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3 cursor-pointer" onclick="switchTab('library')">
                <div class="bg-indigo-600 p-2 rounded-xl text-white shadow-lg shadow-indigo-500/30">
                    <i data-lucide="gamepad-2" class="w-6 h-6"></i>
                </div>
                <span class="text-xl font-bold bg-gradient-to-r from-indigo-400 to-purple-400 bg-clip-text text-transparent">GamerHub</span>
            </div>
            
            <nav class="hidden md:flex space-x-1">
                <button onclick="switchTab('library')" id="nav-library" class="px-4 py-2 rounded-lg text-sm font-medium transition-colors bg-indigo-600 text-white flex items-center gap-2">
                    <i data-lucide="library" class="w-4 h-4"></i> Kütüphane
                </button>
                <button onclick="switchTab('picker')" id="nav-picker" class="px-4 py-2 rounded-lg text-sm font-medium transition-colors text-slate-400 hover:text-white hover:bg-slate-800 flex items-center gap-2">
                    <i data-lucide="shuffle" class="w-4 h-4"></i> Ne Oynasam?
                </button>
                <button onclick="switchTab('friends')" id="nav-friends" class="px-4 py-2 rounded-lg text-sm font-medium transition-colors text-slate-400 hover:text-white hover:bg-slate-800 flex items-center gap-2">
                    <i data-lucide="users" class="w-4 h-4"></i> Arkadaşlar & Liste
                </button>
                <button onclick="switchTab('servers')" id="nav-servers" class="px-4 py-2 rounded-lg text-sm font-medium transition-colors text-slate-400 hover:text-white hover:bg-slate-800 flex items-center gap-2">
                    <i data-lucide="server" class="w-4 h-4"></i> Minecraft Sunucuları
                </button>
            </nav>

            <div class="flex items-center gap-3">
                <button onclick="openAddGameModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-2 rounded-lg text-sm font-medium flex items-center gap-1.5 transition-all shadow-md shadow-indigo-600/20">
                    <i data-lucide="plus" class="w-4 h-4"></i> Oyun Ekle
                </button>
            </div>
        </div>
        <div class="md:hidden flex justify-around bg-slate-900 border-t border-slate-800 py-2">
            <button onclick="switchTab('library')" id="mob-library" class="p-2 text-indigo-400"><i data-lucide="library" class="w-5 h-5"></i></button>
            <button onclick="switchTab('picker')" id="mob-picker" class="p-2 text-slate-400"><i data-lucide="shuffle" class="w-5 h-5"></i></button>
            <button onclick="switchTab('friends')" id="mob-friends" class="p-2 text-slate-400"><i data-lucide="users" class="w-5 h-5"></i></button>
            <button onclick="switchTab('servers')" id="mob-servers" class="p-2 text-slate-400"><i data-lucide="server" class="w-5 h-5"></i></button>
        </div>
    </header>

    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">

        <section id="tab-library" class="space-y-6">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-cardBg p-4 rounded-2xl border border-slate-800 shadow-xl">
                <div>
                    <h1 class="text-2xl font-bold text-white">Oyun Kütüphanesi</h1>
                    <p class="text-sm text-slate-400">Kendi oyun koleksiyonunuzu yönetin, puan verin ve takip edin.</p>
                </div>
                <div class="flex flex-wrap items-center gap-3 w-full sm:w-auto">
                    <div class="relative flex-grow sm:flex-grow-0">
                        <i data-lucide="search" class="w-4 h-4 absolute left-3 top-3 text-slate-400"></i>
                        <input type="text" id="gameSearch" placeholder="Oyun ara..." oninput="filterGames()" class="bg-slate-900 border border-slate-700 rounded-xl pl-9 pr-4 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500
